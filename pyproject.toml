[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-food_delivery_dispatch"
version = "1.0.0"
description = "Food Delivery Dispatch RL Environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # OpenEnv core runtime (FastAPI server + WebSocket client + types)
    "openenv-core[core]>=0.2.2",
    # ASGI server
    "uvicorn[standard]>=0.35.0",
    # Data validation (already a transitive dep of openenv-core)
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
inference = [
    # Only needed for inference.py (LLM agent)
    "openai>=1.30.0",
]

[project.scripts]
server = "food_delivery_dispatch.server.app:main"

[tool.setuptools]
py-modules = ["models", "client"]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "tasks*", "training*"]
